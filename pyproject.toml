[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-astro"
version = "0.1.0"
authors = [{ name = "Lorenzo Monti", email = "lorenzomonti42@gmail.com" }]
description = "Fold, embed, probe: compare foundation-model embeddings, hand-crafted and catalogue features of astronomical light curves."
readme = "README.md"
keywords = ["astronomy", "light curves", "time series", "foundation models", "embeddings", "benchmark"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.10",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
origami = "origami.cli:main"

[project.urls]
Repository = "https://github.com/LorenzoMonti/origami.git"
Documentation = "https://github.com/LorenzoMonti/origami#readme"
Issues = "https://github.com/LorenzoMonti/origami/issues"

# Model families have conflicting pins; see README "Environments" for which extras can share one.
[project.optional-dependencies]
features = ["light-curve>=0.9"]
chronos = ["torch>=2.0", "chronos-forecasting>=2.0"]
mantis = ["torch>=2.0", "mantis-tsfm>=1.1"]
astromer = ["onnxruntime>=1.15", "huggingface_hub>=0.20"]
starclr = ["torch>=2.0", "safetensors>=0.4"]                     # weights downloaded from Zenodo on first use
timestral = ["torch>=2.4"]                                       # plus timestral from GitHub (not on PyPI)
# own environments:
moirai = ["uni2ts>=2.0", "torch>=2.1,<2.5", "transformers<4.57"]  # uni2ts pins torch<2.5, numpy~=1.26
moment = ["torch>=2.0", "momentfm>=0.1.4"]                        # momentfm pins transformers==4.33.3, numpy==1.25.2
toto = ["torch>=2.5", "toto-models>=1.0; python_version >= '3.12'"]  # toto2 needs Python >= 3.12
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["origami*"]
